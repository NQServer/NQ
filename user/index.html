<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NQServer • Configurations</title>
  <meta name="nqserver-userhub-version" content="2.0.0" />
  <link rel="icon" type="image/svg+xml" href="https://nqserver.github.io/NQ/logo-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Vazirmatn:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    (function(){
      try {
        var l = localStorage.getItem('nqserver-user-lang') || 'fa';
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
        var th = localStorage.getItem('nqserver-theme');
        document.documentElement.dataset.theme = th === 'light' ? 'light' : 'dark';
      } catch(e) {}
    })();
  </script>
  <style>
    /* ============ DESIGN SYSTEM (Rebuilt from ground up) ============ */
    :root {
      /* Dark theme (default) - Inspired by modern dev tools & dashboards */
      --bg-root: #090a0f;
      --bg-surface: #111318;
      --bg-elevated: #161920;
      --bg-overlay: #1c1f28;
      --border-default: #262a35;
      --border-emphasis: #323845;
      --text-primary: #e4e7ee;
      --text-secondary: #949db4;
      --text-tertiary: #636b80;
      --accent-primary: #38bdf8;
      --accent-secondary: #a78bfa;
      --accent-success: #34d399;
      --accent-warning: #fbbf24;
      --accent-danger: #f87171;
      --gradient-hero: linear-gradient(135deg, #38bdf8 0%, #a78bfa 50%, #f472b6 100%);
      --gradient-card-border: linear-gradient(145deg, rgba(56, 189, 248, 0.4), rgba(167, 139, 250, 0.4));
      --shadow-lg: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 30px rgba(56, 189, 248, 0.15);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --font-sans: 'Inter', 'Vazirmatn', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    html[data-theme="light"] {
      --bg-root: #f5f7fb;
      --bg-surface: #ffffff;
      --bg-elevated: #f9fafc;
      --bg-overlay: #f1f4f9;
      --border-default: #e2e8f0;
      --border-emphasis: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --accent-primary: #0284c7;
      --accent-secondary: #7c3aed;
      --gradient-hero: linear-gradient(135deg, #0284c7 0%, #7c3aed 100%);
      --shadow-lg: 0 20px 50px -12px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-root);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }
    html[dir="rtl"] body { font-family: 'Vazirmatn', 'Inter', system-ui, sans-serif; }

    /* ============ LAYOUT ============ */
    .app-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 60px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ============ MASTHEAD (new design) ============ */
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      padding: 16px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      flex-wrap: wrap;
    }
    .brand-block {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-mark {
      width: 52px;
      height: 52px;
      background: var(--bg-elevated);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-default);
      position: relative;
      overflow: hidden;
    }
    .brand-mark::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gradient-hero);
      opacity: 0.15;
    }
    .brand-mark img {
      width: 34px;
      height: 34px;
      position: relative;
      z-index: 2;
    }
    .brand-info h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--gradient-hero);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-info .tagline {
      font-size: 12px;
      color: var(--text-tertiary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      background: var(--bg-elevated);
      padding: 5px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-default);
    }
    .toolbar-btn {
      border: none;
      background: transparent;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }
    .toolbar-btn.active {
      background: var(--accent-primary);
      color: #0a0f1a;
      box-shadow: 0 4px 12px rgba(56,189,248,0.3);
    }
    html[data-theme="light"] .toolbar-btn.active { color: #fff; }

    /* ============ HERO TEXT ============ */
    .hero-text {
      font-size: 16px;
      color: var(--text-secondary);
      text-align: center;
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.8;
    }
    .hero-text strong {
      color: var(--accent-primary);
      font-weight: 800;
    }

    /* ============ DASHBOARD CARD (Usage) ============ */
    .dashboard-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      padding: 24px;
      display: none;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      transition: all 0.3s;
    }
    .dashboard-card.visible { display: block; }
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .metric-box {
      background: var(--bg-elevated);
      border-radius: var(--radius-md);
      padding: 16px;
      border: 1px solid var(--border-default);
    }
    .metric-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-tertiary);
      margin-bottom: 8px;
    }
    .metric-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      font-family: var(--font-mono);
    }
    .progress-track {
      height: 6px;
      background: var(--bg-overlay);
      border-radius: 10px;
      margin: 14px 0;
    }
    .progress-thumb {
      height: 100%;
      background: var(--gradient-hero);
      border-radius: 10px;
      width: 0%;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============ SUBSCRIPTION STRIP ============ */
    .sub-strip {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .sub-strip code {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-secondary);
      direction: ltr;
      text-align: left;
      background: var(--bg-elevated);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      white-space: nowrap;
      border: 1px solid var(--border-default);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      background: var(--bg-elevated);
      color: var(--text-primary);
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent-primary);
      color: #0a0f1a;
      border: none;
      font-weight: 800;
    }
    .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }

    /* ============ CONFIG SECTION ============ */
    .config-section {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      overflow: hidden;
    }
    .config-section-header {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-default);
    }
    .config-section-header h2 {
      font-size: 20px;
      font-weight: 700;
    }
    .config-list {
      max-height: 400px;
      overflow-y: auto;
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 2;
      color: var(--text-secondary);
      background: var(--bg-elevated);
      direction: ltr;
      text-align: left;
      white-space: pre-wrap;
    }
    .config-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border-default);
      display: flex;
      gap: 24px;
      color: var(--text-tertiary);
      font-size: 13px;
    }

    /* ============ APPS GRID ============ */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .app-tile {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 20px;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .app-tile.featured {
      border-image: var(--gradient-card-border) 1;
      box-shadow: var(--shadow-glow);
    }
    .app-tile-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .app-tile-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--bg-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #fff;
      font-size: 18px;
    }
    .qr-container {
      display: flex;
      justify-content: center;
      background: #fff;
      border-radius: 12px;
      padding: 8px;
    }
    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ============ TOAST ============ */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent-primary);
      color: #0a0f1a;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 100px;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 640px) {
      .app-shell { padding: 16px; }
      .masthead { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  
  <!-- Masthead -->
  <header class="masthead">
    <div class="brand-block">
      <div class="brand-mark"><img src="https://nqserver.github.io/NQ/logo-mark.svg" alt="NQServer" /></div>
      <div class="brand-info">
        <h1>NQServer</h1>
        <div class="tagline" id="brand-tagline">Configurations</div>
      </div>
    </div>
    <div class="toolbar" id="lang-toolbar">
      <button class="toolbar-btn" data-lang="en">English</button>
      <button class="toolbar-btn" data-lang="fa">فارسی</button>
    </div>
    <div class="toolbar" id="theme-toolbar">
      <button class="toolbar-btn" data-theme="light">☀️ Light</button>
      <button class="toolbar-btn" data-theme="dark">🌙 Dark</button>
    </div>
  </header>

  <p class="hero-text" id="hero-description"></p>

  <!-- Usage Dashboard -->
  <div class="dashboard-card" id="usage-dashboard">
    <div class="metrics-row">
      <div class="metric-box"><div class="metric-label" id="lbl-used">Used</div><div class="metric-value" id="val-used">-</div></div>
      <div class="metric-box"><div class="metric-label" id="lbl-total">Total</div><div class="metric-value" id="val-total">-</div></div>
      <div class="metric-box"><div class="metric-label" id="lbl-expiry">Expires</div><div class="metric-value" id="val-expiry">-</div></div>
    </div>
    <div class="progress-track"><div class="progress-thumb" id="progress-thumb"></div></div>
    <div style="font-size:13px; color: var(--text-tertiary);" id="traffic-detail"></div>
  </div>

  <!-- Subscription Link -->
  <div class="sub-strip">
    <code id="subscription-code">...</code>
    <button class="btn" id="copy-subscription">📋 Copy</button>
  </div>

  <!-- Individual Configs -->
  <div class="config-section">
    <div class="config-section-header">
      <h2>🔗 <span id="config-heading">Single Configs</span></h2>
      <button class="btn btn-primary" id="copy-all-btn">📋 Copy All</button>
    </div>
    <div class="config-list" id="config-text">Loading…</div>
    <div class="config-footer">
      <span>📊 <strong id="config-count-display">0</strong> VLESS URIs</span>
      <span>⚡ Ready for import</span>
    </div>
  </div>

  <!-- Apps Grid -->
  <div class="apps-grid" id="apps-container"></div>

</div>
<div class="toast" id="global-toast"></div>

<script src="https://nqserver.github.io/NQ/qrcode.min.js"></script>
<script>
  (() => {
    const DICT = {
      en: {
        tagline: 'Configurations', hero: 'Select your client, scan the QR code or tap <strong>Add</strong>.',
        used: 'Used', total: 'Total', expires: 'Expires', unlimited: 'Unlimited',
        noExpiry: 'No expiry', expired: 'Expired', daysLeft: 'd left',
        up: 'Upload', down: 'Download', remaining: 'Remaining',
        configTitle: 'Individual Configs', copyAll: 'Copy All', copySub: 'Copy',
        copied: 'Copied!', footer: 'NQServer • Secure Tunnels'
      },
      fa: {
        tagline: 'کانفیگ‌ها', hero: 'کلاینت خود را انتخاب کنید، QR را اسکن یا <strong>افزودن</strong> بزنید.',
        used: 'مصرفی', total: 'حجم کل', expires: 'انقضا', unlimited: 'نامحدود',
        noExpiry: 'بدون انقضا', expired: 'منقضی', daysLeft: 'روز',
        up: 'آپلود', down: 'دانلود', remaining: 'باقی‌مانده',
        configTitle: 'کانفیگ‌های تکی', copyAll: 'کپی همه', copySub: 'کپی',
        copied: 'کپی شد!', footer: 'NQServer • تونل‌های امن'
      }
    };

    let lang = (() => { try { return localStorage.getItem('nqserver-user-lang') || 'fa'; } catch { return 'fa'; } })();
    let theme = document.documentElement.dataset.theme || 'dark';
    let usageInfo = null;
    let configsList = [];

    const APPS = [
      { name: 'Hiddify', color: '#7c5cff', featured: true, fmt: 'b64', deep: u => `hiddify://import/${u}` },
      { name: 'v2rayNG', color: '#2563eb', fmt: 'b64', deep: u => `v2rayng://install-config?url=${encodeURIComponent(u)}` },
      { name: 'Streisand', color: '#0ea5e9', fmt: 'b64', deep: u => `streisand://import/${u}` },
      { name: 'FlClash', color: '#06b6d4', featured: true, fmt: 'clash', deep: u => `clash://install-config?url=${encodeURIComponent(u)}` },
      { name: 'Clash Meta', color: '#10b981', fmt: 'clash', deep: u => `clash://install-config?url=${encodeURIComponent(u)}` },
      { name: 'Karing', color: '#16a34a', fmt: 'clash', deep: u => `karing://install-config?url=${encodeURIComponent(u)}&name=NQServer` },
      { name: 'sing-box', color: '#64748b', fmt: 'singbox', deep: u => `sing-box://import-remote-profile?url=${encodeURIComponent(u)}` },
      { name: 'NekoBox', color: '#f59e0b', fmt: 'singbox', deep: u => `sing-box://import-remote-profile?url=${encodeURIComponent(u)}` }
    ];

    const $ = (id) => document.getElementById(id);
    const t = (key) => DICT[lang][key] || key;

    function toast(msg) {
      const el = $('global-toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1800);
    }

    function copyText(text) {
      navigator.clipboard?.writeText(text).then(() => toast(t('copied'))).catch(() => {});
    }

    function fmtBytes(n) {
      if (!n || n <= 0) return '0 GB';
      const i = Math.floor(Math.log(n) / Math.log(1024));
      return (n / Math.pow(1024, i)).toFixed(2) + ' ' + ['B','KB','MB','GB','TB'][i];
    }

    function buildSub(fmt = 'b64') {
      const u = new URL(location.href);
      ['b64','base64','clash','sb','singbox','raw'].forEach(p => u.searchParams.delete(p));
      let base = u.toString();
      return base + (base.includes('?') ? '&' : '?') + (fmt === 'b64' ? 'b64' : fmt);
    }

    async function loadUsage() {
      try {
        const r = await fetch(buildSub('b64'), { cache: 'no-store' });
        const h = r.headers.get('Subscription-Userinfo');
        if (!h) return;
        const d = {}; h.split(';').forEach(p => { const [k,v] = p.trim().split('='); if (k) d[k.trim()] = Number(v); });
        usageInfo = {
          up: d.upload || 0, down: d.download || 0, total: d.total || 0, expire: d.expire || 0,
          used: (d.upload||0)+(d.download||0), unlim: !d.total || d.total >= 1099511627776000,
          noexp: !d.expire || d.expire >= 4102300000
        };
        renderUsage();
      } catch(e) {}
    }

    async function loadConfigs() {
      try {
        const r = await fetch(buildSub('b64'), { cache: 'no-store' });
        const txt = await r.text();
        let dec = txt;
        try { dec = atob(txt); } catch {}
        configsList = dec.match(/vless:\/\/[^\s]+/g) || [];
        $('config-text').textContent = configsList.length ? configsList.join('\n') : 'No configs found.';
        $('config-count-display').textContent = configsList.length;
      } catch(e) {
        $('config-text').textContent = 'Error loading configs.';
      }
    }

    function renderUsage() {
      const dash = $('usage-dashboard');
      if (!usageInfo) { dash.classList.remove('visible'); return; }
      dash.classList.add('visible');
      $('val-used').textContent = fmtBytes(usageInfo.used);
      $('val-total').textContent = usageInfo.unlim ? t('unlimited') : fmtBytes(usageInfo.total);
      const expEl = $('val-expiry');
      if (usageInfo.noexp) expEl.textContent = t('noExpiry');
      else {
        const days = Math.ceil((usageInfo.expire*1000 - Date.now())/86400000);
        expEl.textContent = days < 0 ? t('expired') : `${days} ${t('daysLeft')}`;
      }
      const pct = usageInfo.unlim ? 0 : Math.min(100, (usageInfo.used/usageInfo.total)*100);
      $('progress-thumb').style.width = pct + '%';
      $('traffic-detail').innerHTML = `↑ ${t('up')}: ${fmtBytes(usageInfo.up)} &nbsp; ↓ ${t('down')}: ${fmtBytes(usageInfo.down)} ${usageInfo.unlim ? '' : '• '+t('remaining')+': '+fmtBytes(Math.max(0,usageInfo.total-usageInfo.used))}`;
    }

    function renderApps() {
      const grid = $('apps-container');
      grid.innerHTML = '';
      APPS.forEach(app => {
        const sub = buildSub(app.fmt);
        const tile = document.createElement('div');
        tile.className = `app-tile ${app.featured ? 'featured' : ''}`;
        tile.innerHTML = `
          <div class="app-tile-header">
            <span class="app-tile-icon" style="background:${app.color}">${app.name[0]}</span>
            <strong>${app.name}</strong>
          </div>
          <div class="qr-container"><div class="qr-target" style="width:130px;height:130px;"></div></div>
          <div class="action-stack">
            <a class="btn btn-primary" href="${app.deep(sub)}">➕ ${t('copySub')}</a>
            <button class="btn copy-app-btn" data-url="${sub}">📋 ${t('copySub')}</button>
          </div>`;
        grid.appendChild(tile);
        try { if(window.QRCode) new QRCode(tile.querySelector('.qr-target'), {text:sub, width:130, height:130}); }
        catch(e) { tile.querySelector('.qr-target').textContent = 'QR'; }
      });
      document.querySelectorAll('.copy-app-btn').forEach(b => b.addEventListener('click', e => copyText(e.target.dataset.url)));
    }

    function refreshUI() {
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      $('brand-tagline').textContent = t('tagline');
      $('hero-description').innerHTML = t('hero');
      $('config-heading').textContent = t('configTitle');
      $('copy-all-btn').textContent = t('copyAll');
      $('copy-subscription').textContent = t('copySub');
      $('subscription-code').textContent = buildSub('b64');
      document.querySelectorAll('#lang-toolbar .toolbar-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
      document.querySelectorAll('#theme-toolbar .toolbar-btn').forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
      renderUsage();
      renderApps();
    }

    // Events
    $('lang-toolbar').addEventListener('click', e => {
      const btn = e.target.closest('[data-lang]'); if(!btn) return;
      lang = btn.dataset.lang; localStorage.setItem('nqserver-user-lang', lang); refreshUI();
    });
    $('theme-toolbar').addEventListener('click', e => {
      const btn = e.target.closest('[data-theme]'); if(!btn) return;
      theme = btn.dataset.theme; document.documentElement.dataset.theme = theme;
      localStorage.setItem('nqserver-theme', theme);
    });
    $('copy-subscription').addEventListener('click', () => copyText(buildSub('b64')));
    $('copy-all-btn').addEventListener('click', () => {
      if(configsList.length) copyText(configsList.join('\n')); else toast('No configs');
    });

    // Init
    refreshUI();
    loadUsage();
    loadConfigs();
  })();
</script>
</body>
</html>
